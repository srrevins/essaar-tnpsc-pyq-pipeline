name: TNPSC PYQ Background Pipeline

on:
  schedule:
    # 20:30 UTC = 02:00 IST. Restarts the free worker for one batch.
    - cron: '30 20 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum number of missing papers to process
        required: true
        default: '1'

permissions:
  contents: read

concurrency:
  group: tnpsc-pyq-background
  cancel-in-progress: false

jobs:
  schedule-free-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
      HF_SPACE_REPO: essaar/essaar-tnpsc-pyq-worker
      PROCESS_LIMIT: ${{ inputs.limit || '3' }}

    steps:
      - name: Checkout pipeline
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: pip install --requirement requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Validate committed official manifest
        run: python pipeline.py validate --manifest data/manifest.json

      - name: Verify secrets
        run: |
          test -n "$HF_TOKEN" || (echo "::error::HF_TOKEN is missing" && exit 1)
          test -n "$HF_DATASET_REPO" || (echo "::error::HF_DATASET_REPO is missing" && exit 1)

      - name: Deploy free Hugging Face worker
        if: github.event_name == 'workflow_dispatch'
        run: python deploy_space.py

      - name: Restart free Hugging Face worker
        if: github.event_name == 'schedule'
        run: |
          python -c "import os; from huggingface_hub import HfApi; a=HfApi(token=os.environ['HF_TOKEN']); a.add_space_variable(os.environ['HF_SPACE_REPO'], 'PROCESS_LIMIT', os.environ['PROCESS_LIMIT']); a.restart_space(os.environ['HF_SPACE_REPO']); print('Worker restarted')"

      - name: Job summary
        if: always()
        run: |
          echo "### TNPSC PYQ scheduler" >> "$GITHUB_STEP_SUMMARY"
          echo "- Paid APIs used: **none**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker: **$HF_SPACE_REPO** (free CPU Basic)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Requested paper limit: **$PROCESS_LIMIT**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dataset: **$HF_DATASET_REPO**" >> "$GITHUB_STEP_SUMMARY"
