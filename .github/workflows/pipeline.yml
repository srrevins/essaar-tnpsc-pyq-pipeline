name: TNPSC PYQ Background Pipeline

on:
  schedule:
    # 20:30 UTC = 02:00 IST. Processes only missing mirrored papers.
    - cron: '30 20 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum number of missing papers to process
        required: true
        default: '1'
      start:
        description: Mirror-manifest index to start scanning from
        required: true
        default: '0'
      force_ocr:
        description: OCR every page instead of preferring embedded PDF text
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tnpsc-pyq-background
  cancel-in-progress: false

jobs:
  extract-mirrored-papers:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PROCESS_LIMIT: ${{ inputs.limit || '3' }}
      START_INDEX: ${{ inputs.start || '0' }}
      FORCE_OCR: ${{ inputs.force_ocr || 'false' }}

    steps:
      - name: Checkout pipeline
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install open-source OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-tam

      - name: Install Python dependencies
        run: pip install --requirement requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Validate release-mirror manifest
        run: python pipeline.py validate --manifest data/mirror_manifest.json

      - name: Extract next missing mirrored papers
        run: |
          extra_args=""
          if [ "$FORCE_OCR" = "true" ]; then extra_args="--force-ocr"; fi
          python pipeline.py sync-github --manifest data/mirror_manifest.json --output-root data --limit "$PROCESS_LIMIT" --start "$START_INDEX" $extra_args

      - name: Commit compressed review drafts
        run: |
          if [ -z "$(git status --porcelain -- data/drafts)" ]; then
            echo "No new drafts."
            exit 0
          fi
          git config user.name "essaar-pyq-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/drafts
          git commit -m "data: add TNPSC extraction drafts"
          git push

      - name: Job summary
        if: always()
        run: |
          echo "### TNPSC PYQ pipeline" >> "$GITHUB_STEP_SUMMARY"
          echo "- Paid APIs used: **none**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: **verified GitHub Release mirror**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Output: **versioned compressed GitHub drafts**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Requested paper limit: **$PROCESS_LIMIT**" >> "$GITHUB_STEP_SUMMARY"
